name: Publish to PyPI

# Publishes on a version tag (e.g. `v0.1.0`). Uses PyPI Trusted Publishing
# (OIDC) — no API token stored in the repo. Configure the trusted publisher
# once at https://pypi.org/manage/project/cxg-author-probe/settings/publishing/
# (workflow: publish.yml, environment: pypi).

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Guard — tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(uv run --no-project python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match pyproject version $proj"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
