[project]
name = "cxg-author-probe"
version = "0.1.0"
description = "Identify and retrieve author cell-type annotations from CELLxGENE source datasets via cheap obs probes + LLM-agent picking"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "David Osumi-Sutherland", email = "do12@sanger.ac.uk"}]
keywords = ["cellxgene", "single-cell", "author-annotations", "h5ad", "anndata"]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "h5py>=3.10",
    "fsspec>=2024.0",
    "aiohttp>=3.9",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "pydantic>=2.6",
    "typer>=0.12",
    "certifi",
]

[project.optional-dependencies]
picker-anthropic = ["anthropic>=0.40"]
eval = ["matplotlib>=3.8", "anndata>=0.10"]
# AnnData-zarr reader runtime deps (imported lazily; numpy is already a base dep).
# zarr>=3 requires Python >=3.11, so it's unavailable on the 3.10 slice of the
# supported range — the reader simply can't be used there.
zarr = ["zarr>=3; python_version >= '3.11'"]
dev = [
    "pytest>=8",
    "datamodel-code-generator>=0.26",
    "ruff>=0.5",
    "anndata>=0.10",
    "matplotlib>=3.8",
    "zarr>=3; python_version >= '3.11'",
]

[project.scripts]
cxg-author = "cxg_author_probe.cli:app"

[project.urls]
Homepage = "https://github.com/Cellular-Semantics/cxg-author-probe"
Repository = "https://github.com/Cellular-Semantics/cxg-author-probe"
Issues = "https://github.com/Cellular-Semantics/cxg-author-probe/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cxg_author_probe"]

[tool.hatch.build.targets.sdist]
include = ["src/cxg_author_probe", "schemas", "tests", "README.md", "LICENSE", "PROPOSAL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:cxg_author_probe.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter where it matters
